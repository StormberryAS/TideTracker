# GitHub Pages serves tide.stormberry.as from this repository root.
#
# Without this file Jekyll publishes the WHOLE repository, so the tooling scripts, the
# README and the licence were all reachable from the live site. Nothing here was secret,
# these repos are public, but source and tooling have no business being served next to
# the product.
#
# Added 2026-09-05 in the estate-wide sweep that followed finding
# scheduler.stormberry.as/index.dev.html live, a second working rendering of that app.
#
# Jekyll's `exclude` REPLACES its defaults rather than adding to them, which is why
# node_modules/ and friends are listed where they apply.
#
# disclaimer.html and privacy.html are deliberately NOT excluded: they are the published
# pages the footer links to. Only the Markdown sources are withheld.
#
# TypeScript (5 November 2026): the app's code is written in ts/ and compiled by tools/build-ts.sh
# into app.js, which IS published (GitHub Pages has no build step, so the compiled file is
# committed), as are the generated cities.js and gate.js and the vendored suncalc.js. The sources
# (ts/, with the cities.js and suncalc.js declarations), the compiler's settings (tsconfig.json),
# the build script and the tests (tools/, tests/), the package files and .npmrc, and node_modules/,
# where npm ci puts TypeScript, are excluded. (.npmrc and .gitattributes are dot files, which Jekyll
# never publishes; .npmrc is listed anyway, as in AstroQuiz and the others.)
#
# 6 November 2026: DISCLAIMER.md, the Markdown source of disclaimer.html, and description.txt, an
# old planning note, are excluded too. No served file links or loads either of them: the gate and
# the footer link disclaimer.html. A stale helper script, update_tides.py, was deleted in the same
# change. Its exclude line stays: Jekyll's exclude list replaces its defaults, so no line goes.
#
# 6 November 2026 (labs round D): "theme: null" stops GitHub Pages from applying its default theme
# (Primer). Without it Pages published the theme's own stylesheet as /assets/css/style.css, a file
# no page of this site links. A test build with the same image as GitHub Pages shows that this file
# is the only one that goes; every other file keeps its bytes. No exclude line was removed.
theme: null
exclude:
  - LICENSE
  - README.md
  - DISCLAIMER.md
  - description.txt
  - bump_assets.py
  - update_tides.py
  - tools/
  - tests/
  - package.json
  - package-lock.json
  - .npmrc
  - node_modules/
  - tsconfig.json
  - ts/
